name: Container Security Scan

on:
  push:
    branches:
      - container-security
  workflow_dispatch:

jobs:
  container-scan:
    runs-on: ubuntu-latest

    steps:
      # 🔴 IMPORTANT: Always checkout MAIN branch
      - name: Checkout MAIN branch code
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Show checked-out branch (proof)
        run: echo "Scanning branch: $(git branch --show-current)"

      - name: Build Docker image from MAIN
        run: |
          docker build -t juice-shop:latest .

      - name: Trivy Image Scan (MAIN image)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: juice-shop:latest
          severity: CRITICAL,HIGH,MEDIUM
          format: table
