name: Trigger Container Scan (CloudFormation)

on:
  workflow_dispatch: # only manual, never triggers automatically

jobs:
  trigger-container:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Container Scan on MAIN
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_PAT }}
          repository: riyazsayami/semester3-coursework
          event-type: container-scan
