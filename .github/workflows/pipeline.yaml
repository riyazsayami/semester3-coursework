name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    #Checkout Code
      - uses: actions/checkout@v3
    #SONARQUBE
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    #IaC Security Scan
      - name: Install Trivy for IaC
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.43.3_Linux-64bit.deb
          sudo dpkg -i trivy_0.43.3_Linux-64bit.deb
      - name: Run IaC Security Scan
        run: |
          trivy config --severity CRITICAL,HIGH,MEDIUM --format json --output trivy-iac-report.json .
      - name: Upload Iac Security Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-iac-report
          path: trivy-iac-report.json

      #Container Security Scan
      - name: Build Docker Image for Security Scan
        run: docker build -t juice-shop-temp .

      - name: Scan Docker Image
        run: |
          trivy image --severity CRITICAL,HIGH,MEDIUM --format json --output trivy-container-report.json juice-shop-temp
      - name: Upload Container Security Report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-container-report
          path: trivy-container-report.json

      #Login to Docker Hub    
      - name: Login to Docker Hub
        run: |
          docker login -u riyazmanandhar -p $DOCKERHUB_PAT
        env:
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}

      #Push Docker Image
      - name: Build Docker image
        run: |
          docker build -t riyazmanandhar/juice-shop:latest .

      - name: Push Docker image
        run: |
          docker push riyazmanandhar/juice-shop:latest

      #Deploy to EC2    
      - name: Update container on EC2
        run: |
            mkdir -p ~/.ssh
            printf "%s" "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H 54.235.194.192 >> ~/.ssh/known_hosts
            ssh -i ~/.ssh/id_ed25519 ubuntu@54.235.194.192 \
              "docker stop juice-shop || true && \
               docker rm juice-shop || true && \
               docker pull riyazmanandhar/juice-shop:latest && \
               docker run -d --restart=always --name juice-shop -p 3000:3000 riyazmanandhar/juice-shop:latest"





