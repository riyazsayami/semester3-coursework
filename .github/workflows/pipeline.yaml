name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: |
          docker login -u riyazmanandhar -p $DOCKERHUB_PAT
        env:
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build Docker image
        run: |
          docker build -t riyazmanandhar/juice-shop:latest .

      - name: Push Docker image
        run: |
          docker push riyazmanandhar/juice-shop:latest

      - name: Decode SSH key
        run: echo "${{ secrets.SSH_KEY }}" 


      # 〰️ NEW STEP ADDED 〰️
      - name: Update container on EC2
        # uses: appleboy/ssh-action@v0.1.6
        # with:
        #   host: ${{ SERVER_IP }}
        #   username: ubuntu
        #   key: |
        #     ${{ secrets.SSH_KEY }}
        run: |
            echo "${{ secrets.SSH_KEY }}" > riyaz.pem 
            ssh ubuntu@54.235.194.192 -i riyaz.pem
            docker stop juice-shop || true
            docker rm juice-shop || true
            docker pull riyazmanandhar/juice-shop:latest
            docker run -d --restart=always --name juice-shop -p 3000:3000 riyazmanandhar/juice-shop:latest