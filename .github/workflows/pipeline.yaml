name: Deploy to Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    env:
      SERVER_IP: ${{ vars.SERVER_IP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and Push Docker Image
        run: |
          docker login -u riyazmanandhar -p $DOCKERHUB_PAT
          docker build -t riyazmanandhar/juice-shop:latest .
          docker push riyazmanandhar/juice-shop:latest
        env:
          DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Add SSH key
        run: |
          echo "$SSH_KEY64" | base64 -d > pem.pem
          chmod 400 pem.pem
          ssh-keygen -R $SERVER_IP
        env:
          SSH_KEY64: ${{ secrets.SSH_KEY64 }}

      - name: Deploy container on EC2
        run: |
          ssh -i pem.pem ubuntu@$SERVER_IP "docker pull riyazmanandhar/juice-shop:latest"
          ssh -i pem.pem ubuntu@$SERVER_IP "docker stop juice-shop || true"
          ssh -i pem.pem ubuntu@$SERVER_IP "docker rm juice-shop || true"
          ssh -i pem.pem ubuntu@$SERVER_IP "docker run -d --name juice-shop -p 3000:3000 riyazmanandhar/juice-shop:latest"
