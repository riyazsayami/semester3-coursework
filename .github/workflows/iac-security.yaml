name: Trivy IaC Scan (CloudFormation)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  trivy-iac-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH,MEDIUM"
          format: "table"
          exit-code: "0"
      
      - name: Save Trivy report
        run: trivy config --severity CRITICAL,HIGH,MEDIUM --format json --output trivy-report.json .

      # Step 2: Upload the report as artifact
      - name: Upload Trivy report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy-report.json